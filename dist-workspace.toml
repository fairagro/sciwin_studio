[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# Builds the no-admin-rights installer/app format for the current OS (AppImage
# on Linux, per-user NSIS on Windows, .app on macOS) and hands dist a file
# named after the package binary, since dist only knows how to archive a
# single loose executable next to Cargo.toml. See scripts/dist-bundle.sh.
build-command = ["bash", "scripts/dist-bundle.sh"]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# No shell/powershell installers: the artifact per-platform is already the
# real installer/app (NSIS exe, AppImage, .app), not a bare CLI binary.
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Ship the real macOS .app bundle alongside the raw binary dist also archives
# (dist-bundle.sh creates an empty placeholder on Linux/Windows so this path
# always exists).
include = ["SciWIn Studio.app"]
github-build-setup = "../build-setup.yml"

[dist.github-custom-runners]
global = "ubuntu-latest"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-latest"
x86_64-pc-windows-msvc = "windows-latest"
x86_64-apple-darwin = "macos-latest"
aarch64-apple-darwin = "macos-latest"
