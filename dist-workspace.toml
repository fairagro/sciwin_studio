[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# No shell/powershell installers: the artifact per-platform is already the
# real installer/app (NSIS exe, AppImage, .app), not a bare CLI binary.
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# dist's own local-artifact build always does a plain `cargo build` for a
# Cargo-based workspace (this crate) - it never consults `build-command`,
# that's a Generic/JS-workspace-only feature. So we replace the whole
# build-local-artifacts job with our own, which still uses `dist build` for
# its correct manifest/archive/checksum handling, then patches the resulting
# archive to swap the plain binary for the real `dx bundle` output. See
# .github/workflows/build-app.yml.
build-local-artifacts = false
local-artifacts-jobs = ["./build-app"]

[dist.github-custom-runners]
global = "ubuntu-latest"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-latest"
x86_64-pc-windows-msvc = "windows-latest"
x86_64-apple-darwin = "macos-latest"
aarch64-apple-darwin = "macos-latest"
